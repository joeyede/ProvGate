name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode and simulator
        run: |
          set -euo pipefail
          # The runner ships several Xcodes. The default is often an older one
          # whose simulators xcodebuild cannot use for testing (it falls back to
          # "My Mac"). Select the NEWEST installed Xcode — it owns matching
          # simulators and lines up with local dev (iPhone 17 / iOS 26).
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

          # Ground truth: ask xcodebuild which destinations it can actually use,
          # and grab the newest concrete iPhone simulator id. This is fast (~20s)
          # so a bad setup fails here in under a minute, not after a full build.
          DEST=$(xcodebuild -project ProvGate.xcodeproj -scheme ProvGate -showdestinations 2>/dev/null \
            | grep 'platform:iOS Simulator' \
            | grep 'name:iPhone' \
            | grep -v 'placeholder' \
            | sort -V \
            | tail -1 || true)
          if [ -z "$DEST" ]; then
            echo "No concrete iOS Simulator destination available." >&2
            xcodebuild -project ProvGate.xcodeproj -scheme ProvGate -showdestinations 2>&1 | tail -40 >&2
            exit 1
          fi
          echo "Destination: $DEST"
          SIM_UDID=$(echo "$DEST" | grep -oE 'id:[0-9A-Fa-f-]+' | head -1 | cut -d: -f2)
          if [ -z "$SIM_UDID" ]; then
            echo "Could not parse simulator id from: $DEST" >&2
            exit 1
          fi
          echo "Booting $SIM_UDID"
          xcrun simctl boot "$SIM_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$SIM_UDID" -b || true
          echo "SIMULATOR_UDID=$SIM_UDID" >> "$GITHUB_ENV"

      - name: Configure integration credentials
        env:
          PROVGATE_TEST_USERNAME: ${{ secrets.PROVGATE_TEST_USERNAME }}
          PROVGATE_TEST_PASSWORD: ${{ secrets.PROVGATE_TEST_PASSWORD }}
        run: |
          if [ -n "$PROVGATE_TEST_USERNAME" ]; then
            printf 'export PROVGATE_TEST_USERNAME="%s"\nexport PROVGATE_TEST_PASSWORD="%s"\n' \
              "$PROVGATE_TEST_USERNAME" "$PROVGATE_TEST_PASSWORD" > ~/.provgate-test-env
          fi

      - name: Run tests
        run: |
          if [ -f ~/.provgate-test-env ]; then
            bash scripts/run-tests.sh --with-env
          else
            bash scripts/run-tests.sh
          fi
