name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - name: Select simulator
        run: |
          # Ask xcodebuild which iPhone simulators it actually supports — avoids
          # picking an iOS-26-beta device that Xcode 16 doesn't know about.
          SIM_NAME=$(xcodebuild -project ProvGate.xcodeproj -scheme ProvGate \
            -showdestinations 2>/dev/null \
            | grep 'platform:iOS Simulator' \
            | grep -oE 'name:[^,}]+' \
            | grep -E 'name:iPhone [0-9]' \
            | sed 's/name://' \
            | sort -u \
            | sort -V \
            | tail -1)
          if [ -z "$SIM_NAME" ]; then
            echo "No compatible iPhone simulator found" >&2
            xcodebuild -project ProvGate.xcodeproj -scheme ProvGate -showdestinations 2>&1 >&2 || true
            exit 1
          fi
          echo "Using simulator: $SIM_NAME"
          xcrun simctl boot "$SIM_NAME" 2>/dev/null || true
          xcrun simctl bootstatus "$SIM_NAME" -b
          echo "SIMULATOR_NAME=$SIM_NAME" >> "$GITHUB_ENV"

      - name: Configure integration credentials
        env:
          PROVGATE_TEST_USERNAME: ${{ secrets.PROVGATE_TEST_USERNAME }}
          PROVGATE_TEST_PASSWORD: ${{ secrets.PROVGATE_TEST_PASSWORD }}
        run: |
          if [ -n "$PROVGATE_TEST_USERNAME" ]; then
            printf 'export PROVGATE_TEST_USERNAME="%s"\nexport PROVGATE_TEST_PASSWORD="%s"\n' \
              "$PROVGATE_TEST_USERNAME" "$PROVGATE_TEST_PASSWORD" > ~/.provgate-test-env
          fi

      - name: Run tests
        run: |
          if [ -f ~/.provgate-test-env ]; then
            bash scripts/run-tests.sh --with-env
          else
            bash scripts/run-tests.sh
          fi
