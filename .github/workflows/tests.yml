name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - name: Select simulator
        run: |
          # simctl lists runtimes from ALL installed Xcodes (including betas).
          # Restrict to the major iOS version the active Xcode SDK targets.
          IOS_SDK=$(xcrun --sdk iphonesimulator --show-sdk-version)
          IOS_MAJOR="${IOS_SDK%%.*}"
          echo "Active Xcode iOS SDK: $IOS_SDK (major: $IOS_MAJOR)"

          # Pick the last (newest by sort -V) iPhone from the matching iOS section.
          SELECTED=$(xcrun simctl list devices available 2>/dev/null \
            | awk -v major="$IOS_MAJOR" '
                /^-- /{ p = ($0 ~ ("^-- iOS " major "\\.")) }
                p && /iPhone [0-9]/
              ' \
            | sort -V \
            | tail -1)

          if [ -z "$SELECTED" ]; then
            echo "No compatible iPhone simulator found for iOS $IOS_MAJOR" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi

          SIM_NAME=$(echo "$SELECTED" | sed -E 's/^[[:space:]]*(iPhone [^(]+)\(.*/\1/' | sed 's/[[:space:]]*$//')
          SIM_UDID=$(echo "$SELECTED" | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}')

          echo "Using simulator: $SIM_NAME ($SIM_UDID)"
          xcrun simctl boot "$SIM_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$SIM_UDID" -b
          echo "SIMULATOR_NAME=$SIM_NAME" >> "$GITHUB_ENV"
          echo "SIMULATOR_UDID=$SIM_UDID" >> "$GITHUB_ENV"

      - name: Configure integration credentials
        env:
          PROVGATE_TEST_USERNAME: ${{ secrets.PROVGATE_TEST_USERNAME }}
          PROVGATE_TEST_PASSWORD: ${{ secrets.PROVGATE_TEST_PASSWORD }}
        run: |
          if [ -n "$PROVGATE_TEST_USERNAME" ]; then
            printf 'export PROVGATE_TEST_USERNAME="%s"\nexport PROVGATE_TEST_PASSWORD="%s"\n' \
              "$PROVGATE_TEST_USERNAME" "$PROVGATE_TEST_PASSWORD" > ~/.provgate-test-env
          fi

      - name: Run tests
        run: |
          if [ -f ~/.provgate-test-env ]; then
            bash scripts/run-tests.sh --with-env
          else
            bash scripts/run-tests.sh
          fi
